name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  sandbox-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: npm
      - run: npm ci
      - name: Install QEMU fallback
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: Boot sandbox and execute smoke command
        env:
          PI_STUDENT_HOME: ${{ runner.temp }}/pi-student
          XDG_CACHE_HOME: ${{ runner.temp }}/pi-student/cache
        run: npm run test:sandbox
