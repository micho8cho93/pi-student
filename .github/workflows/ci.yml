name: CI Core

on:
  push:
    paths:
      - "apps/**"
      - "packages/**"
      - "tooling/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - "tsconfig.json"
      - ".github/workflows/ci*.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "tooling/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - "tsconfig.json"
      - ".github/workflows/ci*.yml"
  workflow_dispatch:

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: npm
      - run: npm ci
      - run: npm run test:architecture
      - run: npm run ci:affected

  full-fallback:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
