name: CI Client

on:
  push:
    paths: &client-paths
      - "apps/client/**"
      - "packages/classroom/**"
      - "packages/contracts/**"
      - "packages/education/**"
      - "packages/paseo-adapter/**"
      - "packages/policy/**"
      - "packages/publishing/**"
      - "packages/runtime/**"
      - "packages/sandbox/**"
      - "packages/sandbox-gondolin/**"
      - "packages/sdk/**"
      - "packages/shared/**"
      - "packages/supabase-adapter/**"
      - "packages/telemetry/**"
      - "scripts/package-release.sh"
      - "install.sh"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/ci-client.yml"
  pull_request:
    paths: *client-paths
  workflow_dispatch:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: npm
      - run: npm ci
      - run: npm run build:client
      - run: npm run test:client
      - name: Verify client release boundary
        run: npm run package:client -- linux-x64 apps/client/artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: client-boundary-linux-x64
          path: apps/client/artifacts/*.tar.gz
          retention-days: 3
